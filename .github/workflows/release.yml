name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - run: ./scripts/build.sh
      - name: Check the tag matches the app version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw build/Coolant.app/Contents/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Coolant-$GITHUB_REF_NAME-arm64.zip"
          ditto -c -k --keepParent build/Coolant.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --verify-tag --generate-notes
